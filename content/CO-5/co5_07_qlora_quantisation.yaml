- id: CO5-P07-C02
  code: CO5.7.2
  title: QLoRA workflow and 4-bit base models
  session: 31
  skilling_exp: 'CO5 practical focus: qlora and quantisation'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO5-P07-C01
  eli5: Describe how QLoRA combines a quantised frozen base with trainable low-rank adapters.
  key_points:
  - Explain the purpose and boundary of qlora workflow and 4-bit base models.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: QLoRA makes parameter-efficient fine-tuning possible with a quantised base model. The base weights
    are loaded in a low-bit representation and generally kept frozen, while LoRA adapters are trained. The workflow
    depends on compatible model, quantisation and training libraries, and hardware support. Quantisation settings,
    compute dtype, adapter targets and memory-saving options should be recorded. A successful load does not prove
    that training is configured correctly; run a small forward and backward pass, verify gradients on the intended
    adapter parameters and save a test checkpoint before launching a longer experiment. Keep the evaluation protocol
    stable across runs, inspect representative outputs, and record the exact revisions used so another learner can
    reproduce the comparison and understand its limitations.
