  eli5: Compare QLoRA and LoRA using resource measurements and held-out task quality.
  key_points:
  - Explain the purpose and boundary of memory, latency and quality trade-offs.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: The course practical asks learners to compare memory, latency and quality under QLoRA with 4-bit quantisation.
    Measure peak GPU memory during training and inference, training duration, generation latency and task performance
    on the same evaluation set. Include batch size, sequence length, hardware and quantisation configuration because
    these strongly affect results. A smaller memory footprint may permit a larger batch or model, but quantisation
    can introduce quality changes and may not accelerate every workload. Report the full configuration and compare
    against an appropriate LoRA or baseline run rather than assuming 4-bit is always faster or better.
