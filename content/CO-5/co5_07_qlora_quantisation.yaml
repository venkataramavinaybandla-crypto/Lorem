- id: CO5-P07-C01
  code: CO5.7.1
  title: Quantisation fundamentals
  session: 31
  skilling_exp: 'CO5 practical focus: qlora and quantisation'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO5-P06-C03
  eli5: Explain how lower-precision representations reduce model memory requirements.
  key_points:
  - Explain the purpose and boundary of quantisation fundamentals.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: 'Quantisation represents model values using fewer bits than a conventional higher-precision format.
    Lower bit-width weights can reduce memory use and may improve deployment feasibility on limited hardware. Quantisation
    introduces approximation error, so quality and numerical behaviour must be measured. Weight quantisation is
    distinct from reducing the number of model parameters: the model architecture may remain the same while its
    stored representation changes. Different quantisation schemes have different accuracy, speed and compatibility
    properties. Record the quantisation method and configuration because a statement such as ''4-bit'' alone does
    not fully describe the runtime behaviour.'
  formulas: []
