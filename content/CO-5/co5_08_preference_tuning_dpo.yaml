- id: CO5-P08-C02
  code: CO5.8.2
  title: Direct Preference Optimization concept
  session: 32
  skilling_exp: 'CO5 practical focus: preference tuning and dpo'
  btl: Apply
  difficulty: Advanced
  prereqs:
  - CO5-P08-C01
  eli5: Explain how DPO uses preference pairs to optimise a policy relative to a reference model.
  key_points:
  - Explain the purpose and boundary of direct preference optimization concept.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: 'Direct Preference Optimization is a preference-tuning method that trains a policy using chosen and
    rejected response pairs, with a reference policy contributing to the objective. Rather than requiring a separately
    trained reward model and an online reinforcement-learning loop in the same way as some RLHF pipelines, DPO directly
    optimises a preference-based objective. Its behaviour depends on the quality of preference data, the reference
    model, beta or related configuration and training setup. DPO is not simply supervised learning on preferred
    answers alone: the rejected alternative is part of the comparison. Evaluate the resulting model on independent
    task and safety tests.'
