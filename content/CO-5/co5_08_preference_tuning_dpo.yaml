- id: CO5-P08-C01
  code: CO5.8.1
  title: Preference data and chosen-rejected pairs
  session: 32
  skilling_exp: 'CO5 practical focus: preference tuning and dpo'
  btl: Apply
  difficulty: Advanced
  prereqs:
  - CO5-P07-C03
  eli5: Represent human or curated preferences as comparisons between alternative responses.
  key_points:
  - Explain the purpose and boundary of preference data and chosen-rejected pairs.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: Preference datasets commonly pair a prompt with a preferred response and a less-preferred response.
    The labels express a relative preference under a defined criterion, such as helpfulness, correctness or style.
    They do not necessarily establish that the preferred response is objectively true. Data collection should define
    the rating instructions, annotator guidance, disagreement handling and privacy controls. Inspect pairs for ambiguous
    prompts, inconsistent labels and accidental preference for verbosity or tone over correctness. Keep preference
    data separate from the shared test set and document its provenance and limitations. Keep the evaluation protocol
    stable across runs, inspect representative outputs, and record the exact revisions used so another learner can
    reproduce the comparison and understand its limitations.
  formulas: []
  viz:
    type: preference pair
    description: prompt; chosen response; rejected response; preference criterion
    params:
    - data or request
    - method/configuration
    - evaluation set
    - quality
    - latency and cost
    compute: Trace one example through the method, identify its resource requirements, and record the evaluation
      evidence needed to justify the choice.
    outcomes:
    - The method's role is clear.
    - Trade-offs are measurable.
    - A failure mode and mitigation can be stated.
  common_mistakes:
  - Assuming preference data and chosen-rejected pairs automatically improves every task.
  - Ignoring data leakage or incompatible model and tokenizer versions.
  - Treating one metric as a complete measure of deployment quality.
  quiz:
  - type: mcq
    question: Which option best represents preference data and chosen-rejected pairs?
    options:
    - Represent human or curated preferences as comparisons between alternative responses.
    - It removes the need for a held-out evaluation set.
    - It guarantees a model will never hallucinate.
    - It makes dataset and model versions irrelevant.
    answer: 0
    explanation: 'The defining idea is: Represent human or curated preferences as comparisons between alternative
      responses.'
  - type: short_answer
    question: Explain one important distinction or design consideration in preference data and chosen-rejected pairs.
    expected_answer: A correct answer should explain the central idea of preference data and chosen-rejected pairs
      and connect it to a relevant data, model, evaluation or operational consideration.
    explanation: The response should be specific to the method and should not rely on unsupported guarantees.
  - type: application
    question: You are adapting a course assistant. Describe how you would apply preference data and chosen-rejected
      pairs and how you would verify the result.
    expected_answer: A strong response identifies the data or configuration, a fair baseline, at least two relevant
      measurements, one likely failure mode and a mitigation.
    explanation: The task tests practical transfer and evidence-based engineering judgement.
