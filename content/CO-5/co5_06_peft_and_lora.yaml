- id: CO5-P06-C02
  code: CO5.6.2
  title: Low-Rank Adaptation mechanics
  session: 30
  skilling_exp: 'CO5 practical focus: parameter-efficient fine-tuning and lora'
  btl: Apply
  difficulty: Advanced
  prereqs:
  - CO5-P06-C01
  eli5: Describe how LoRA represents weight updates through low-rank matrices.
  key_points:
  - Explain the purpose and boundary of low-rank adaptation mechanics.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: LoRA commonly freezes an original weight matrix and learns a low-rank update represented by two smaller
    matrices. If the original projection has dimensions d by k, the update can be represented using matrices with
    rank r, where r is much smaller than the original dimensions. This reduces trainable parameter count. The adapter
    update is scaled by a factor involving alpha and rank, and is applied to selected layers such as attention projections.
    Rank, target modules, alpha and dropout are configuration choices. A higher rank may increase capacity and memory
    use, but does not automatically produce better generalisation; compare configurations empirically.
  formulas: []
