- id: CO5-P06-C01
  code: CO5.6.1
  title: Parameter-Efficient Fine-Tuning overview
  session: 30
  skilling_exp: 'CO5 practical focus: parameter-efficient fine-tuning and lora'
  btl: Apply
  difficulty: Advanced
  prereqs:
  - CO5-P05-C03
  eli5: Explain why PEFT adapts a model while training a smaller subset of parameters.
  key_points:
  - Explain the purpose and boundary of parameter-efficient fine-tuning overview.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: Parameter-Efficient Fine-Tuning methods reduce the number of parameters that must be updated or stored
    during adaptation. Instead of changing every base-model weight, a PEFT method introduces or selects a smaller
    set of trainable parameters. This can reduce optimiser memory, checkpoint size and training cost, making adaptation
    more feasible on constrained hardware. The base model remains important and must be available at inference,
    and adapter compatibility depends on the exact base model and configuration. PEFT is not a guarantee of equal
    quality to full fine-tuning; evaluate it on the target task and document the trade-offs.
  formulas: []
  viz:
    type: PEFT architecture
    description: frozen base; trainable adapter; optimiser state; checkpoint
    params:
    - data or request
    - method/configuration
    - evaluation set
    - quality
    - latency and cost
