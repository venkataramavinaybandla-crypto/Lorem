- id: CO5-P02-C01
  code: CO5.2.1
  title: Instruction-response dataset structure
  session: 26
  skilling_exp: 'CO5 practical focus: instruction dataset engineering'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO5-P01-C03
  eli5: Design examples that clearly represent the task, input and desired response.
  key_points:
  - Explain the purpose and boundary of instruction-response dataset structure.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: An instruction dataset commonly contains an instruction or task description, an input when needed,
    and a target response. The exact representation depends on the model's chat template and training pipeline,
    so formatting must be consistent with the tokenizer and model family. Each example should teach a behaviour
    that is relevant to the intended deployment task. Avoid mixing unrelated formats or leaving ambiguous separators
    between roles. Include representative normal cases, difficult cases and appropriate refusals where those behaviours
    are required. Before training, inspect rendered examples after applying the model's chat template; a structurally
    valid JSONL file can still encode the wrong conversational sequence.
  formulas: []
  viz:
    type: dataset record
    description: instruction; input; response; role; chat template
    params:
    - data or request
    - method/configuration
    - evaluation set
    - quality
    - latency and cost
    compute: Trace one example through the method, identify its resource requirements, and record the evaluation
      evidence needed to justify the choice.
    outcomes:
    - The method's role is clear.
    - Trade-offs are measurable.
    - A failure mode and mitigation can be stated.
  common_mistakes:
  - Assuming instruction-response dataset structure automatically improves every task.
  - Ignoring data leakage or incompatible model and tokenizer versions.
  - Treating one metric as a complete measure of deployment quality.
  quiz:
  - type: mcq
    question: Which option best represents instruction-response dataset structure?
    options:
    - Design examples that clearly represent the task, input and desired response.
    - It removes the need for a held-out evaluation set.
    - It guarantees a model will never hallucinate.
    - It makes dataset and model versions irrelevant.
    answer: 0
    explanation: 'The defining idea is: Design examples that clearly represent the task, input and desired response.'
  - type: short_answer
    question: Explain one important distinction or design consideration in instruction-response dataset structure.
    expected_answer: A correct answer should explain the central idea of instruction-response dataset structure
      and connect it to a relevant data, model, evaluation or operational consideration.
    explanation: The response should be specific to the method and should not rely on unsupported guarantees.
  - type: application
    question: You are adapting a course assistant. Describe how you would apply instruction-response dataset structure
      and how you would verify the result.
    expected_answer: A strong response identifies the data or configuration, a fair baseline, at least two relevant
      measurements, one likely failure mode and a mitigation.
    explanation: The task tests practical transfer and evidence-based engineering judgement.
  exam_tags:
  - CO5
  - Fine-Tuning
  - Adaptation
  - Evaluation
