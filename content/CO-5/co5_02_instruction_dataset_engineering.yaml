- id: CO5-P02-C03
  code: CO5.2.3
  title: Data preprocessing and training-ready formatting
  session: 26
  skilling_exp: 'CO5 practical focus: instruction dataset engineering'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO5-P02-C02
  eli5: Transform raw examples into a reproducible training representation without losing meaning.
  key_points:
  - Explain the purpose and boundary of data preprocessing and training-ready formatting.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: 'Preprocessing may include normalising whitespace, removing malformed records, filtering duplicates,
    checking required fields and applying the model''s conversation template. Be cautious with aggressive cleaning:
    punctuation, code formatting, multilingual spelling and domain-specific symbols may carry meaning. Track rejected
    records and reasons so that filtering does not silently alter the dataset. Validate token lengths against the
    model''s context and training configuration, and decide how overlength examples will be handled. Store the raw
    source separately from the processed snapshot. The same preprocessing code and configuration should be reusable
    when a dataset is revised or an experiment is reproduced.'
