    baseline, two metrics, one likely failure and how you would document the result.
- id: CO5-P02-C02
  code: CO5.2.2
  title: Data quality, coverage and diversity
  session: 26
  skilling_exp: 'CO5 practical focus: instruction dataset engineering'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO5-P02-C01
  eli5: Assess correctness, consistency, representativeness and coverage before training.
  key_points:
  - Explain the purpose and boundary of data quality, coverage and diversity.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: Training data quality places a practical ceiling on adaptation quality. Incorrect targets can teach
    incorrect behaviour; inconsistent formatting can make the task harder to learn; duplicated examples can overweight
    a narrow pattern; and unrepresentative data can create poor performance on real requests. Review examples for
    correctness, clarity, relevance, privacy and licensing. Measure distributions such as task type, language, length
    and label frequency. Include difficult and boundary cases rather than only easy demonstrations. Data cleaning
    should be documented and reversible where possible. Human review is especially important for examples where
    correctness is difficult to determine automatically.
  formulas: []
