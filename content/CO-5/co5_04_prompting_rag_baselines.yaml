- id: CO5-P04-C03
  code: CO5.4.3
  title: Accuracy, latency and cost measurement
  session: 28
  skilling_exp: 'CO5 practical focus: prompting and rag baselines'
  btl: Evaluate
  difficulty: Intermediate
  prereqs:
  - CO5-P04-C02
  eli5: Compare baselines using consistent quality and operational measurements.
  key_points:
  - Explain the purpose and boundary of accuracy, latency and cost measurement.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: The course requires prompting and RAG baselines to be compared on accuracy, latency and cost. Define
    accuracy in a way that fits the task, such as exact match, classification F1 or a calibrated rubric. Measure
    latency consistently, noting whether it includes retrieval and network time; report a useful statistic such
    as median and a tail percentile. Estimate cost using input/output tokens, embedding calls, storage and any other
    material service charges. Record hardware, provider and test conditions. A quality improvement may be unattractive
    if it creates excessive latency or cost, while a cheaper approach may be unacceptable if it misses critical
    cases. Report trade-offs instead of hiding them in one score.
  formulas: []
  viz:
    type: measurement dashboard
    description: accuracy; latency; tokens; cost; comparable conditions
    params:
    - data or request
    - method/configuration
    - evaluation set
    - quality
    - latency and cost
