- id: CO5-P09-C03
  code: CO5.9.3
  title: Failure analysis and method selection
  session: 33
  skilling_exp: 'CO5 practical focus: comparing adaptation strategies'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO5-P09-C02
  eli5: Choose an approach based on error patterns and the source of the task's difficulty.
  key_points:
  - Explain the purpose and boundary of failure analysis and method selection.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: Different approaches address different failure causes. If the model lacks current facts, retrieval
    may help; if the output format is inconsistent, prompting or structured decoding may be sufficient; if a stable
    task behaviour remains poor despite good examples and context, fine-tuning may be worth testing. Retrieval can
    fail through missing documents or poor ranking; fine-tuning can fail through noisy data, overfitting or forgetting;
    prompting can fail through ambiguity or context limits. Inspect errors by category before changing methods.
    Document the selected approach, alternatives rejected, assumptions and evidence that would trigger reconsideration.
  formulas: []
  viz:
    type: failure diagnosis tree
    description: error category; root cause; candidate method; evidence
    params:
    - data or request
    - method/configuration
    - evaluation set
    - quality
    - latency and cost
    compute: Trace one example through the method, identify its resource requirements, and record the evaluation
      evidence needed to justify the choice.
    outcomes:
    - The method's role is clear.
    - Trade-offs are measurable.
    - A failure mode and mitigation can be stated.
