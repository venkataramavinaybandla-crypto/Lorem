- id: CO5-P03-C03
  code: CO5.3.3
  title: Shared test set and leakage prevention
  session: 27
  skilling_exp: 'CO5 practical focus: dataset cards and evaluation sets'
  btl: Understand
  difficulty: Intermediate
  prereqs:
  - CO5-P03-C02
  eli5: Keep one fixed evaluation set when comparing prompting, RAG and fine-tuned models.
  key_points:
  - Explain the purpose and boundary of shared test set and leakage prevention.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: The CO5 practical outcome requires a shared test set for comparing prompting and RAG baselines with
    adapted models. Every approach should receive equivalent test questions and be scored using the same task definitions.
    Keep test answers and labels out of training data, prompt examples and router training. Watch for indirect leakage
    through duplicated documents, cached outputs or manual tuning based on test failures. If the test set must change,
    version it and explain why scores across revisions may not be directly comparable. Preserve a separate diagnostic
    set for iterative debugging so the final shared test remains meaningful.
