- id: CO5-P05-C01
  code: CO5.5.1
  title: Supervised fine-tuning objective
  session: 29
  skilling_exp: 'CO5 practical focus: supervised fine-tuning'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO5-P04-C03
  eli5: Explain how labelled input-output examples update a pretrained model's behaviour.
  key_points:
  - Explain the purpose and boundary of supervised fine-tuning objective.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: Supervised fine-tuning trains a pretrained model on examples of desired inputs and outputs. During
    training, the model predicts target tokens and the optimisation process adjusts trainable parameters to reduce
    the training objective, commonly token-level cross-entropy for causal language modelling. The model begins with
    general capabilities learned during pretraining; fine-tuning nudges its behaviour toward the supplied task distribution.
    The quality of the targets, formatting and coverage matters greatly. Fine-tuning does not simply store each
    example as a fact, nor does it guarantee that the model will follow every instruction. It can overfit, forget
    some prior behaviour or learn unwanted patterns if the dataset is poor.
  formulas: []
  viz:
    type: SFT learning loop
    description: pretrained weights; examples; target tokens; loss; update
    params:
    - data or request
    - method/configuration
    - evaluation set
    - quality
    - latency and cost
    compute: Trace one example through the method, identify its resource requirements, and record the evaluation
      evidence needed to justify the choice.
    outcomes:
    - The method's role is clear.
    - Trade-offs are measurable.
    - A failure mode and mitigation can be stated.
  common_mistakes:
  - Assuming supervised fine-tuning objective automatically improves every task.
  - Ignoring data leakage or incompatible model and tokenizer versions.
  - Treating one metric as a complete measure of deployment quality.
  quiz:
  - type: mcq
    question: Which option best represents supervised fine-tuning objective?
    options:
    - Explain how labelled input-output examples update a pretrained model's behaviour.
    - It removes the need for a held-out evaluation set.
    - It guarantees a model will never hallucinate.
    - It makes dataset and model versions irrelevant.
    answer: 0
    explanation: 'The defining idea is: Explain how labelled input-output examples update a pretrained model''s
      behaviour.'
