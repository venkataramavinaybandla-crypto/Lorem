- id: CO5-P05-C02
  code: CO5.5.2
  title: Preparing a model and training configuration
  session: 29
  skilling_exp: 'CO5 practical focus: supervised fine-tuning'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO5-P05-C01
  eli5: Choose a compatible base model, tokenizer, chat template and training setup.
  key_points:
  - Explain the purpose and boundary of preparing a model and training configuration.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: A training run must align the base model, tokenizer, conversation format and objective. Confirm model
    architecture and supported context length, tokenizer revision, special tokens and chat template before preparing
    examples. Configure batch size, gradient accumulation, learning rate, epochs, sequence length, optimiser and
    checkpointing according to the available hardware. Begin with a small smoke test that verifies batches, loss
    computation and checkpoint saving. Track random seeds and software versions where practical. Training settings
    should be chosen through controlled experiments, not copied blindly from another model whose size, data or hardware
    differs.
