    question: Explain one important distinction or design consideration in supervised fine-tuning objective.
    expected_answer: A correct answer should explain the central idea of supervised fine-tuning objective and connect
      it to a relevant data, model, evaluation or operational consideration.
    explanation: The response should be specific to the method and should not rely on unsupported guarantees.
  - type: application
