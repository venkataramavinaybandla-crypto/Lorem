- id: CO5-P05-C03
  code: CO5.5.3
  title: Training diagnostics and overfitting
  session: 29
  skilling_exp: 'CO5 practical focus: supervised fine-tuning'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO5-P05-C02
  eli5: Monitor loss and held-out performance to identify undertraining or overfitting.
  key_points:
  - Explain the purpose and boundary of training diagnostics and overfitting.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: Training loss indicates how well the model fits the examples it sees, but it is not sufficient evidence
    of useful adaptation. Validation loss and task-specific evaluation reveal whether improvements transfer to unseen
    examples. A widening gap between training and validation performance can indicate overfitting. Other warning
    signs include repetitive outputs, degraded general ability, unstable loss or poor handling of examples outside
    the training distribution. Inspect generated samples at checkpoints and compare them with the original model
    on the shared test set. Use early stopping or adjust data and training settings when evidence shows that additional
    training is harming generalisation.
  formulas: []
  viz:
    type: training curves
    description: training loss; validation loss; checkpoint; generalisation
    params:
    - data or request
