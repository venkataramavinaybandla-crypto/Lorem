- id: CO5-P10-C02
  code: CO5.10.2
  title: Router training, validation and monitoring
  session: 34
  skilling_exp: 'CO5 practical focus: learned model router and release v0.5'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO5-P10-C01
  eli5: Train and assess a routing policy without leaking test information or hiding costly mistakes.
  key_points:
  - Explain the purpose and boundary of router training, validation and monitoring.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: A learned router needs labelled examples that associate request features with a suitable route under
    a documented objective. Labels may be derived from controlled comparisons, but they should account for quality
    thresholds, latency, cost and safety constraints rather than simply choosing the highest-scoring model. Split
    router data into training and validation partitions and keep the shared final test set untouched. Evaluate route
    accuracy as well as downstream answer quality, cost and latency. Monitor route distribution, fallback frequency,
    error rates and shifts in request patterns after deployment. Include a safe default when confidence is low or
    a route is unavailable.
