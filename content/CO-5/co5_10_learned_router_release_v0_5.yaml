- id: CO5-P10-C03
  code: CO5.10.3
  title: Decision record and release v0.5
  session: 34
  skilling_exp: 'CO5 practical focus: learned model router and release v0.5'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO5-P10-C02
  eli5: Document the selected adaptation strategy, router evidence, risks and release criteria.
  key_points:
  - Explain the purpose and boundary of decision record and release v0.5.
  - Identify required data, model and configuration assumptions.
  - Use a fair baseline and task-relevant measurements.
  - Document limitations, resource use and failure cases.
  deep_dive: 'Release v0.5 should include the dataset card, shared test-set version, prompting and RAG baselines,
    fine-tuning configurations, LoRA and QLoRA resource measurements, and DPO demonstration results where available.
    The decision record should compare accuracy, latency and cost, describe the learned router and its fallback
    behaviour, and identify known limitations. State which model and adapter versions are deployed, how they can
    be rolled back and what monitoring will detect degradation. The release should be evidence-led: if an approach
    does not improve the target workload enough to justify its cost, document that conclusion rather than forcing
    a fine-tuning result. A complete experiment record should also state assumptions that affect interpretation,
    including the source and revision of the base model, dataset snapshot, preprocessing choices, hardware constraints
    and evaluation exclusions. Keep these details alongside the result so the recommendation is auditable.'
