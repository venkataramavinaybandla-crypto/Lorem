- id: input-output-token-accounting
  code: GA-CO1.8.1
  title: Input and Output Token Accounting
  session: 8
  skilling_exp: 2
  btl: 2
  difficulty: 2
  prereqs: []
  eli5: Input tokens are the tokens sent to the model, while output tokens are generated in response.
    Both can contribute to usage and cost, so an application should measure them separately.
  key_points:
  - Input tokens include the request context sent to the model.
  - Output tokens are generated by the model.
  - Providers may price input and output tokens differently.
  - Actual counts should be taken from provider or tokenizer usage data.
  deep_dive: Token economics begins by separating input usage from output usage. Input tokens may include
    system instructions, user messages, conversation history and any context added by the application.
    Output tokens are generated by the model as it produces a response. Many hosted model services report
    these quantities separately and may apply different prices to them. This means a feature that produces
    long responses can have a different cost profile from one that sends large prompts but returns short
    answers. The CO-1 handout explicitly includes input/output token counts, context limits and cost estimation.
    An application should capture the usage values returned by the provider where available and should
    use the correct tokenizer for pre-request estimates. It should not assume that character count or
    word count gives an accurate billable token count. Separating input and output also helps teams identify
    whether cost growth comes from long prompts, repeated history, retrieved context or verbose responses.
  formulas: []
  viz:
    type: token_meter
    description: Adjust input and output token counts and observe total usage.
    params:
    - name: input
      label: Input
      min: 0
      max: 100000
      step: 100
      default: 1200
      unit: tokens
    - name: output
      label: Output
      min: 0
      max: 100000
      step: 50
      default: 350
      unit: tokens
    compute:
      total: input + output
    outcomes:
    - when: input + output <= 4000
      title: Small illustrative request
      explain: The combined usage is within the illustrative 4,000-token threshold.
      severity: info
    - when: input + output > 4000
      title: Larger illustrative request
      explain: Review prompt size, context and output requirements against the actual model limit.
      severity: warn
    combos_to_try:
    - set:
        input: 1200
        output: 350
      lesson: Classify a sample request's token usage into input and output components.
  common_mistakes:
  - Assuming a token is always the same as a word.
  - Treating a model's fluent output as proof that the answer is correct.
  - Ignoring the model, tokenizer, provider or measurement conditions when comparing results.
  quiz:
  - type: mcq
    question: Which statement best describes input and output token accounting?
    options:
    - It should be understood in the context of the model, task and stated assumptions.
    - It is identical across every provider and model.
    - It can be evaluated without considering the input or output.
    - It removes the need to measure system behaviour.
    answer: 0
    explanation: The correct interpretation depends on the concept's role in the course and the stated
      conditions.
  - type: short_answer
    question: Explain the main idea of input and output token accounting in your own words.
    answer: A clear answer should define the concept, explain its role and connect it to the CO-1 application.
    explanation: Look for a correct definition and a relevant practical implication.
  - type: application
    question: Give one practical situation in which input and output token accounting matters when building
      an LLM application.
    answer: A suitable answer identifies a concrete request or design decision and explains how the concept
      affects it.
    explanation: The response should connect the concept to a measurable application behaviour or engineering
      choice.
  exam_tags:
  - mid-term
  - end-sem
  - practical
  mini_task: Calculate total tokens for five sample requests and identify which component dominates.
- id: token-cost-estimation
  code: GA-CO1.8.2
  title: Estimating Token Cost
  session: 8
  skilling_exp: 3
  btl: 2
  difficulty: 2
  prereqs:
  - input-output-token-accounting
  eli5: Token cost can be estimated by multiplying input and output token quantities by their respective
    per-token prices. The actual prices and billing units must come from the provider's current pricing
    information.
  key_points:
  - Input and output may have separate rates.
  - Convert token counts to the pricing unit before multiplying.
  - Use the selected model's current provider pricing.
  - An estimate is not a substitute for the provider's final usage record.
  deep_dive: 'A basic token-cost estimate uses the number of input and output tokens and the corresponding
    prices. If a provider quotes a price per one million tokens, divide each token count by one million
    before multiplying by its rate. Calculate input and output costs separately when the rates differ,
    then add them to obtain the estimated request cost. For example, a request with 2,000 input tokens
    and 500 output tokens should be costed using the input rate for 2,000 tokens and the output rate for
    500 tokens. The handout asks students to apply token-cost arithmetic to budget a feature. The arithmetic
    is straightforward, but the inputs must be correct: prices vary by model and provider, and pricing
    can change. Some services may have additional charges or different treatment for cached tokens, tools
    or other features. Therefore, the estimate should state its pricing source, date, model and assumptions.
    Record actual usage and compare it with the estimate to improve future budgets.'
  formulas: []
  viz:
    type: cost_calculator
    description: Change token counts and per-million-token rates to estimate request cost.
    params:
    - name: input
      label: Input
      min: 0
      max: 100000
      step: 100
      default: 2000
      unit: tokens
    - name: output
      label: Output
      min: 0
      max: 100000
      step: 100
      default: 500
      unit: tokens
    - name: input_rate
      label: Input Rate
      min: 0
      max: 100
      step: 0.1
      default: 2
      unit: currency/M tokens
    - name: output_rate
      label: Output Rate
      min: 0
      max: 100
      step: 0.1
      default: 8
      unit: currency/M tokens
    compute:
      input_cost: input / 1000000 * input_rate
      output_cost: output / 1000000 * output_rate
      total_cost: input_cost + output_cost
    outcomes:
    - when: total_cost <= 0.01
      title: Low illustrative request cost
      explain: This is a small example cost; multiply by expected request volume for a feature budget.
      severity: info
    - when: total_cost > 0.01
      title: Higher illustrative request cost
      explain: Review the model rates and projected usage volume before finalising a budget.
      severity: warn
    combos_to_try:
    - set:
        input: 2000
        output: 500
        input_rate: 2
        output_rate: 8
      lesson: Estimate cost for 1,000 requests using average input and output token counts.
  common_mistakes:
  - Assuming a token is always the same as a word.
  - Treating a model's fluent output as proof that the answer is correct.
  - Ignoring the model, tokenizer, provider or measurement conditions when comparing results.
  quiz:
  - type: mcq
    question: Which statement best describes estimating token cost?
    options:
    - It should be understood in the context of the model, task and stated assumptions.
    - It is identical across every provider and model.
    - It can be evaluated without considering the input or output.
    - It removes the need to measure system behaviour.
    answer: 0
    explanation: The correct interpretation depends on the concept's role in the course and the stated
      conditions.
  - type: short_answer
    question: Explain the main idea of estimating token cost in your own words.
    answer: A clear answer should define the concept, explain its role and connect it to the CO-1 application.
    explanation: Look for a correct definition and a relevant practical implication.
  - type: application
    question: Give one practical situation in which estimating token cost matters when building an LLM
      application.
    answer: A suitable answer identifies a concrete request or design decision and explains how the concept
      affects it.
    explanation: The response should connect the concept to a measurable application behaviour or engineering
      choice.
  exam_tags:
  - mid-term
  - end-sem
  - practical
  mini_task: Build a small feature budget with assumptions, per-request cost and monthly request volume.
- id: feature-budgeting-and-rate-limits
  code: GA-CO1.8.3
  title: Feature Budgeting, Context, and Rate Limits
  session: 8
  skilling_exp: 3
  btl: 3
  difficulty: 2
  prereqs:
  - token-cost-estimation
  eli5: Feature budgeting estimates how much a model-powered feature may consume over time. It combines
    expected requests, input and output tokens, model prices, context limits and rate limits.
  key_points:
  - Budgeting scales per-request usage by expected request volume.
  - Context capacity constrains the size of each request and response.
  - Rate limits constrain how quickly requests can be sent.
  - Use measured traffic and explicit assumptions for planning.
  deep_dive: 'A feature budget translates per-request token usage into an expected operating cost. First
    estimate how many requests the feature will receive in a chosen period. Then estimate average input
    and output tokens per request, apply the relevant model prices and multiply by request volume. The
    budget should also account for context limits: a request that combines a long conversation history
    with retrieved documents may exceed the model''s allowed context. Rate limits create a separate throughput
    constraint; a feature may have enough budget but still be unable to serve a traffic spike at the desired
    rate. The CO-1 lecture plan explicitly includes input/output cost arithmetic, context and rate limits,
    and budgeting a feature. Good estimates make assumptions visible and should be updated with observed
    measurements after release. A useful budget also includes a safety margin and a plan for handling
    requests that exceed configured limits. The exact prices, quotas and context limits must be taken
    from the selected provider''s current documentation.'
  formulas: []
  viz:
    type: budget_planner
    description: Adjust request volume and average request cost to estimate a period budget.
    params:
    - name: requests
      label: Requests
      min: 1
      max: 1000000
      step: 100
      default: 10000
      unit: requests
    - name: cost_per_request
      label: Cost Per Request
      min: 0
      max: 10
      step: 0.001
      default: 0.008
      unit: currency/request
    compute:
      period_cost: requests * cost_per_request
    outcomes:
    - when: requests <= 1000
      title: Small illustrative volume
      explain: A small request volume gives a modest projected cost, subject to actual usage.
      severity: info
    - when: requests > 1000
      title: Scaled feature volume
      explain: At scale, small per-request costs can become significant; compare projections with measured
        traffic.
      severity: warn
    combos_to_try:
    - set:
        requests: 10000
        cost_per_request: 0.008
      lesson: Estimate a monthly budget and identify the assumptions that most affect it.
  common_mistakes:
  - Assuming a token is always the same as a word.
  - Treating a model's fluent output as proof that the answer is correct.
  - Ignoring the model, tokenizer, provider or measurement conditions when comparing results.
  quiz:
  - type: mcq
