- id: CO6-P05-C03
  code: CO6.5.3
  title: Ethics layer, fairness and responsible personalisation
  session: 35
  skilling_exp: 'CO6 practical focus: hyper-personalisation and ethics'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO6-P05-C02
  eli5: Evaluate whether personalised behaviour is appropriate, explainable and equitable across users.
  key_points:
  - Explain the purpose and boundary of ethics layer, fairness and responsible personalisation.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: An ethics layer considers whether a system's behaviour could unfairly exclude, stereotype, manipulate
    or disadvantage users. Evaluate outputs across relevant language varieties, user contexts and task categories,
    while respecting privacy and avoiding unnecessary sensitive profiling. Give users ways to understand and adjust
    personalisation, and provide human review for consequential cases. Define prohibited uses and escalation paths.
    Monitor complaints, differential error patterns and unexpected profile-driven behaviour. A checklist alone cannot
    establish fairness; teams need evidence, stakeholder input and ongoing review. Document known limitations and
    avoid claims that the system is unbiased or fully ethical.
