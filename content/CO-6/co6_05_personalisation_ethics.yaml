- id: CO6-P05-C02
  code: CO6.5.2
  title: Consent, privacy controls and data lifecycle
  session: 35
  skilling_exp: 'CO6 practical focus: hyper-personalisation and ethics'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO6-P05-C01
  eli5: Make consent meaningful and provide controls for access, correction, retention and deletion.
  key_points:
  - Explain the purpose and boundary of consent, privacy controls and data lifecycle.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A governed application should explain what profile data is used for and provide appropriate controls
    over that use. Consent should be specific, informed and revocable where applicable; it should not be hidden
    inside an unrelated acceptance. Store consent status and its version or timestamp so the system can apply the
    user's current choice. Define retention periods and deletion workflows for profile records, conversation data,
    derived embeddings and backups. Minimise personal data in prompts, traces and analytics. Access control, encryption
    and secure secret handling remain necessary even when consent exists. Consent does not make every data use appropriate,
    and legal requirements depend on the deployment context.
