- id: CO6-P05-C01
  code: CO6.5.1
  title: User profiles and preference-aware responses
  session: 35
  skilling_exp: 'CO6 practical focus: hyper-personalisation and ethics'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO6-P04-C03
  eli5: Use user profile data to tailor an experience only when the data is relevant and authorised.
  key_points:
  - Explain the purpose and boundary of user profiles and preference-aware responses.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Hyper-personalisation can adapt language, response depth, preferred formats or other product behaviour
    using a user profile stored in MongoDB. Profile attributes should have a clear purpose, source and update mechanism.
    Do not infer or store sensitive traits merely because they might improve engagement. Personalisation should
    be transparent and controllable, and the application should still provide a useful default when no profile exists.
    Keep profile retrieval scoped to the authenticated user and pass only the minimum relevant fields to downstream
    model prompts. Test that one user's profile cannot influence another user's response. Personalisation is a product
    capability, not permission to collect unlimited personal information.
  formulas: []
  viz:
    type: architecture flow
    description: Visualise the responsibilities, interfaces and controls involved in user profiles and preference-aware
      responses.
    params:
    - component
    - request/data
    - contract
    - control
    - observable outcome
    compute: Trace one user request through the relevant components. Mark the data boundary, the validation or security
      control, and the evidence that confirms success.
    outcomes:
    - Responsibilities and interfaces are explicit.
    - A failure path and mitigation are identified.
    - The design can be tested and operated.
  common_mistakes:
  - Putting every responsibility into one endpoint or component.
  - Assuming internal services, model output or retrieved data are automatically trusted.
  - Treating a successful local demo as proof of production readiness.
  quiz:
  - type: mcq
    question: Which statement best describes user profiles and preference-aware responses?
    options:
    - Use user profile data to tailor an experience only when the data is relevant and authorised.
    - It removes the need for testing and monitoring.
    - It guarantees the application is secure by itself.
    - It makes service contracts and access controls unnecessary.
    answer: 0
    explanation: The central idea is to use user profile data to tailor an experience only when the data is relevant
      and authorised.
  - type: short_answer
    question: Identify one important design consideration for user profiles and preference-aware responses.
    expected_answer: A good answer identifies a relevant boundary, contract, security control, operational concern
      or measurable test.
    explanation: The answer should connect the concept to observable application behaviour.
  - type: application
