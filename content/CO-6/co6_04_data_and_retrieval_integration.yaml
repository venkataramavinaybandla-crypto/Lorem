- id: CO6-P04-C03
  code: CO6.4.3
  title: Data consistency, ingestion and retrieval orchestration
  session: 34
  skilling_exp: 'CO6 practical focus: mongodb and chroma integration'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P04-C02
  eli5: Coordinate source records and vector indexes so retrieval remains traceable and current.
  key_points:
  - Explain the purpose and boundary of data consistency, ingestion and retrieval orchestration.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: The ingestion pipeline should create or update authoritative document records and then maintain corresponding
    vector chunks. Because MongoDB and Chroma are separate systems, updates may partially succeed. Use idempotent
    ingestion jobs, status fields, retryable steps and reconciliation checks to detect missing or stale vectors.
    Preserve document version, chunk position, access metadata and ingestion timestamp. At query time, apply access
    controls before returning retrieved content to the model. The orchestration layer should record which source
    chunks were used so citations and debugging are possible. Establish a re-indexing procedure when the embedding
    model, chunking policy or corpus changes.
