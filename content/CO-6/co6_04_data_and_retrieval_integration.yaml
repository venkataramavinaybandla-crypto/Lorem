- id: CO6-P04-C01
  code: CO6.4.1
  title: MongoDB as the application system of record
  session: 34
  skilling_exp: 'CO6 practical focus: mongodb and chroma integration'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P03-C03
  eli5: Store durable application entities and metadata in MongoDB with clear ownership and access rules.
  key_points:
  - Explain the purpose and boundary of mongodb as the application system of record.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: MongoDB can serve as the system of record for application data such as users, consent settings, conversation
    metadata, document records and operational state. Design collections around access patterns and define stable
    identifiers and ownership fields. Validate data before persistence and enforce authorisation in the service
    layer so one user cannot read another user's records. Store only information needed for the product purpose
    and establish retention and deletion behaviour. For document ingestion, preserve source metadata and revision
    information so retrieval results can be traced back to their origin. A database record should remain authoritative
    for application state even when derived search indexes are rebuilt.
  formulas: []
  viz:
    type: architecture flow
    description: Visualise the responsibilities, interfaces and controls involved in mongodb as the application
      system of record.
    params:
    - component
    - request/data
    - contract
    - control
    - observable outcome
    compute: Trace one user request through the relevant components. Mark the data boundary, the validation or security
      control, and the evidence that confirms success.
    outcomes:
    - Responsibilities and interfaces are explicit.
    - A failure path and mitigation are identified.
    - The design can be tested and operated.
  common_mistakes:
  - Putting every responsibility into one endpoint or component.
  - Assuming internal services, model output or retrieved data are automatically trusted.
  - Treating a successful local demo as proof of production readiness.
  quiz:
  - type: mcq
    question: Which statement best describes mongodb as the application system of record?
    options:
    - Store durable application entities and metadata in MongoDB with clear ownership and access rules.
    - It removes the need for testing and monitoring.
    - It guarantees the application is secure by itself.
    - It makes service contracts and access controls unnecessary.
    answer: 0
    explanation: The central idea is to store durable application entities and metadata in mongodb with clear ownership
      and access rules.
