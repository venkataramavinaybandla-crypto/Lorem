- id: CO6-P04-C02
  code: CO6.4.2
  title: Chroma vector store integration
  session: 34
  skilling_exp: 'CO6 practical focus: mongodb and chroma integration'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P04-C01
  eli5: Use Chroma to index and retrieve embedding vectors while preserving document identity and metadata.
  key_points:
  - Explain the purpose and boundary of chroma vector store integration.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Chroma is used in the course architecture as the vector store for semantic retrieval. A typical flow
    creates embeddings for document chunks, stores vectors with identifiers and metadata, then queries for nearest
    neighbours using an embedded user question. Keep the original document and authoritative metadata in MongoDB,
    and treat Chroma as a derived index that can be rebuilt. Use stable chunk identifiers to connect retrieved passages
    to their source records. Ensure the embedding model and dimensions are consistent between indexing and querying.
    Handle stale or deleted documents by synchronising index updates, and do not assume a vector result is automatically
    relevant or authorised for the requesting user.
