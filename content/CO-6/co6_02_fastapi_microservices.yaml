- id: CO6-P02-C03
  code: CO6.2.3
  title: Service communication, resilience and API lifecycle
  session: 32
  skilling_exp: 'CO6 practical focus: fastapi microservices'
  btl: Create
  difficulty: Intermediate
  prereqs:
  - CO6-P02-C02
  eli5: Design service calls with timeouts, error handling, versioning and graceful failure behaviour.
  key_points:
  - Explain the purpose and boundary of service communication, resilience and api lifecycle.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Microservices communicate over network boundaries, so a dependency that works locally may fail through
    latency, timeouts, partial responses or deployment mismatch. Set explicit connection and read timeouts, use
    bounded retries only for operations that are safe to repeat, and propagate correlation identifiers across service
    calls. Define stable API versions and make compatibility expectations clear. Avoid retry storms by applying
    backoff and limits. For user-facing operations, decide whether a degraded response, cached result, fallback
    model or clear temporary error is appropriate. Health checks should distinguish process liveness from dependency
    readiness. Record failures in traces while avoiding sensitive request content in logs.
