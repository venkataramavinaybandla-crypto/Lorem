- id: CO6-P02-C02
  code: CO6.2.2
  title: Pydantic contracts and API validation
  session: 32
  skilling_exp: 'CO6 practical focus: fastapi microservices'
  btl: Create
  difficulty: Intermediate
  prereqs:
  - CO6-P02-C01
  eli5: Define typed request and response models and validate data at service boundaries.
  key_points:
  - Explain the purpose and boundary of pydantic contracts and api validation.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Pydantic models provide typed contracts for API inputs and outputs. A request model can require fields,
    constrain values and reject malformed payloads before business logic runs. Response models make the public API
    shape explicit and reduce accidental leakage of internal fields. Validation should include semantic checks beyond
    type checking, such as verifying that a requested resource belongs to the authenticated user. Keep schemas versioned
    when clients depend on them, and return consistent error structures that do not expose secrets or stack traces.
    Validate data again at trust boundaries between services because internal traffic can still be malformed or
    compromised. Schema validity is not authorisation; permission checks remain a separate responsibility.
