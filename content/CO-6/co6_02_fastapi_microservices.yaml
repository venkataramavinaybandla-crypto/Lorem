- id: CO6-P02-C01
  code: CO6.2.1
  title: Gateway, RAG service and model service
  session: 32
  skilling_exp: 'CO6 practical focus: fastapi microservices'
  btl: Create
  difficulty: Intermediate
  prereqs:
  - CO6-P01-C03
  eli5: Divide platform responsibilities into gateway, retrieval and model services with explicit contracts.
  key_points:
  - Explain the purpose and boundary of gateway, rag service and model service.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: The course practical identifies a gateway, RAG service and model service as core FastAPI microservices.
    The gateway handles client-facing requests, authentication, request validation and orchestration. The RAG service
    manages retrieval and context construction, while the model service handles model invocation and generation
    configuration. Services communicate through defined request and response contracts rather than reaching into
    one another's internal state. This separation allows independent testing and scaling, but it introduces network
    failure, versioning and observability concerns. Keep service responsibilities narrow, set timeouts and define
    what happens when a downstream service is unavailable. A modular monolith may be simpler initially; use separate
    deployable services when the operational benefit justifies the complexity.
  formulas: []
  viz:
    type: architecture flow
    description: Visualise the responsibilities, interfaces and controls involved in gateway, rag service and model
      service.
    params:
    - component
    - request/data
    - contract
    - control
    - observable outcome
    compute: Trace one user request through the relevant components. Mark the data boundary, the validation or security
      control, and the evidence that confirms success.
    outcomes:
    - Responsibilities and interfaces are explicit.
    - A failure path and mitigation are identified.
    - The design can be tested and operated.
  common_mistakes:
  - Putting every responsibility into one endpoint or component.
  - Assuming internal services, model output or retrieved data are automatically trusted.
  - Treating a successful local demo as proof of production readiness.
  quiz:
  - type: mcq
    question: Which statement best describes gateway, rag service and model service?
    options:
    - Divide platform responsibilities into gateway, retrieval and model services with explicit contracts.
    - It removes the need for testing and monitoring.
    - It guarantees the application is secure by itself.
    - It makes service contracts and access controls unnecessary.
    answer: 0
    explanation: The central idea is to divide platform responsibilities into gateway, retrieval and model services
      with explicit contracts.
  - type: short_answer
