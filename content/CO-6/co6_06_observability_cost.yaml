    Identify its inputs, outputs, one trust boundary, one failure case and how you would test it.
- id: CO6-P06-C02
  code: CO6.6.2
  title: Cost dashboards and usage controls
  session: 36
  skilling_exp: 'CO6 practical focus: observability and cost management'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO6-P06-C01
  eli5: Measure token and service costs and connect them to product usage and operational limits.
  key_points:
  - Explain the purpose and boundary of cost dashboards and usage controls.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A cost dashboard should make usage visible by model, request type, user or tenant where appropriate,
    and time period. Include input and output tokens, embedding calls, retrieval usage and relevant infrastructure
    costs. Apply budgets, rate limits and alerts so a runaway workflow cannot create uncontrolled spending. Distinguish
    estimated provider cost from actual billed cost and document pricing assumptions. Track cost alongside quality
    and latency; reducing tokens by truncating critical evidence may harm answer quality. Use sampling and aggregation
    carefully so monitoring itself does not become expensive or expose private data.
