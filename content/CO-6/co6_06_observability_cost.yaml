- id: CO6-P06-C03
  code: CO6.6.3
  title: Graceful degradation and operational reliability
  session: 36
  skilling_exp: 'CO6 practical focus: observability and cost management'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO6-P06-C02
  eli5: Keep the application understandable and safe when models or supporting services fail.
  key_points:
  - Explain the purpose and boundary of graceful degradation and operational reliability.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A platform should define behaviour for model-provider outages, retrieval failures, timeouts, rate limits
    and observability interruptions. Graceful degradation may mean returning a clear temporary error, switching
    to an approved fallback model, serving a cached non-sensitive result or allowing a non-AI workflow to continue.
    Never silently fabricate an answer when retrieval is unavailable if the product promises grounded responses.
    Use circuit breakers or bounded retries where appropriate, and expose service health to operators. Test degraded
    paths deliberately. Reliability includes communicating limitations honestly and preserving safety controls when
    dependencies are unavailable. Document the configuration and assumptions used, retain representative test evidence,
    and repeat the check after relevant service, model or infrastructure changes. This makes the behaviour easier
    to reproduce and the operational limits easier to communicate.
