- id: CO6-P10-C03
  code: CO6.10.3
  title: Measured v0.1 to v1.0 release and operations record
  session: 40
  skilling_exp: 'CO6 practical focus: mcp and production release'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P10-C02
  eli5: Document platform maturity through staged releases, evidence, risks and rollback procedures.
  key_points:
  - Explain the purpose and boundary of measured v0.1 to v1.0 release and operations record.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A measured release progression should state what capability exists at each version, what evidence supports
    it and which risks remain. An early v0.1 may demonstrate a working vertical slice; later versions can add retrieval,
    personalisation, tracing, guardrails, CI and cloud deployment. The final v1.0 record should identify service
    and prompt versions, infrastructure revision, test results, security findings, operational metrics, cost assumptions
    and rollback instructions. Define ownership for incidents and ongoing maintenance. Do not label a system production-ready
    solely because it is deployed. Production readiness requires reliable operation, privacy and security controls,
    documented limitations and evidence that critical user journeys work under both normal and failure conditions.
