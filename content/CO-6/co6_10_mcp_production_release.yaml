- id: CO6-P10-C02
  code: CO6.10.2
  title: End-to-end integration, security and acceptance testing
  session: 40
  skilling_exp: 'CO6 practical focus: mcp and production release'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P10-C01
  eli5: Verify the complete user journey and critical safety properties across all platform components.
  key_points:
  - Explain the purpose and boundary of end-to-end integration, security and acceptance testing.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Integration testing checks that the frontend, gateway, RAG service, model service, MongoDB, Chroma,
    tracing and guardrails work together. Test normal requests, missing context, unsupported questions, unauthorised
    access, malformed payloads, provider timeouts and service outages. Verify that citations refer to retrieved
    sources, user data remains isolated and sensitive values do not appear in logs. Include container and infrastructure
    checks in the release pipeline. Acceptance criteria should be measurable and linked to the course outcome, not
    limited to whether the interface loads. Record test evidence, known issues and the environment in which the
    checks were performed.
