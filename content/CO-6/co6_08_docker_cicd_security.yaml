- id: CO6-P08-C01
  code: CO6.8.1
  title: Docker and docker-compose service packaging
  session: 38
  skilling_exp: 'CO6 practical focus: containerisation and ci/cd'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P07-C03
  eli5: Package services and their dependencies into reproducible containers for local and deployed environments.
  key_points:
  - Explain the purpose and boundary of docker and docker-compose service packaging.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Docker images package an application with its runtime dependencies, while docker-compose can define
    a multi-service local environment such as gateway, RAG service, model service, MongoDB and supporting components.
    Use explicit image versions and configuration through environment variables or secret mechanisms. Keep persistent
    data in appropriate volumes rather than inside ephemeral containers. Define health checks and dependency readiness,
    and avoid assuming that container start order means a service is ready. Containers improve reproducibility but
    do not automatically make an application secure; image contents, permissions, networking and secrets still require
    deliberate controls.
  formulas: []
