- id: CO6-P08-C03
  code: CO6.8.3
  title: GitHub Actions CI and security scanning
  session: 38
  skilling_exp: 'CO6 practical focus: containerisation and ci/cd'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P08-C02
  eli5: Automate tests, image checks and infrastructure scans before changes are released.
  key_points:
  - Explain the purpose and boundary of github actions ci and security scanning.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A CI pipeline can run linting, unit and integration tests, schema checks, container builds and security
    scans on pull requests. The course handout specifically names Trivy and tfsec/checkov for image and infrastructure
    checks. Store credentials as protected CI secrets and grant workflows only the permissions they need. Pin or
    review third-party actions and avoid printing secrets in logs. Define release gates for critical test failures
    and serious vulnerabilities, with documented exceptions where necessary. CI should produce traceable build artefacts
    and test reports. Passing scans are evidence of checks performed, not proof that the system has no vulnerabilities.
