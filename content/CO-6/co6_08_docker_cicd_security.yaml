- id: CO6-P08-C02
  code: CO6.8.2
  title: Hardened images and container security
  session: 38
  skilling_exp: 'CO6 practical focus: containerisation and ci/cd'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P08-C01
  eli5: Reduce container attack surface through minimal images, least privilege and dependency hygiene.
  key_points:
  - Explain the purpose and boundary of hardened images and container security.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Hardened container images use only necessary packages, run as non-root where possible, avoid embedding
    secrets and keep dependencies patched. Pin base images and review image provenance. Use read-only filesystems
    and restricted capabilities when compatible with the application. Scan images for known vulnerabilities and
    establish a process for prioritising and fixing findings. Avoid copying development tools or local credentials
    into production images. A vulnerability scanner can report known issues but cannot prove an image is secure;
    combine automated scanning with configuration review and runtime controls. Document the configuration and assumptions
    used, retain representative test evidence, and repeat the check after relevant service, model or infrastructure
    changes. This makes the behaviour easier to reproduce and the operational limits easier to communicate.
