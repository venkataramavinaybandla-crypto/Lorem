- id: CO6-P07-C03
  code: CO6.7.3
  title: Kill switches, incident response and safety operations
  session: 37
  skilling_exp: 'CO6 practical focus: guardrails and human oversight'
  btl: Evaluate
  difficulty: Advanced
  prereqs:
  - CO6-P07-C02
  eli5: Provide a controlled way to disable risky capabilities and recover from incidents.
  key_points:
  - Explain the purpose and boundary of kill switches, incident response and safety operations.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A kill switch can disable a model, tool, feature or entire AI workflow when a serious issue is detected.
    It should be accessible to authorised operators, logged, tested and designed to fail safely. Define the scope
    of each switch and the user-facing fallback behaviour. An incident plan should identify owners, severity levels,
    evidence collection, communication and rollback steps. Do not rely on a hidden prompt instruction as a kill
    switch. Test emergency disablement in a controlled environment and ensure it does not accidentally remove essential
    authentication, logging or data-protection controls.
