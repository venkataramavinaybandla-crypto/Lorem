- id: CO6-P09-C03
  code: CO6.9.3
  title: Deploying and operating the platform on AWS
  session: 39
  skilling_exp: 'CO6 practical focus: aws and terraform deployment'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P09-C02
  eli5: Plan deployment, configuration, monitoring, rollback and cost controls for the running application.
  key_points:
  - Explain the purpose and boundary of deploying and operating the platform on aws.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A deployment plan should describe how container images are built, tagged, stored in ECR and started
    on the selected compute environment. Configure services through managed environment settings and secure secret
    storage rather than embedding credentials in images. Define health checks, logs, metrics, backups and update
    procedures. Use staged releases where practical and retain a known-good image for rollback. Monitor instance
    utilisation, network behaviour, service latency and cloud costs. A successful deployment command is not the
    same as an operational production service; verify end-to-end user flows, access boundaries, failure handling
    and recovery procedures after deployment.
