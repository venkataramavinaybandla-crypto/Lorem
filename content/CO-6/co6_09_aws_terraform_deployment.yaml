    Identify its inputs, outputs, one trust boundary, one failure case and how you would test it.
- id: CO6-P09-C02
  code: CO6.9.2
  title: AWS VPC, IAM, ECR and EC2 foundations
  session: 39
  skilling_exp: 'CO6 practical focus: aws and terraform deployment'
  btl: Create
  difficulty: Advanced
  prereqs:
  - CO6-P09-C01
  eli5: Understand the core AWS resources named in the course deployment outcome.
  key_points:
  - Explain the purpose and boundary of aws vpc, iam, ecr and ec2 foundations.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: The course handout identifies VPC, IAM, ECR and EC2 as deployment building blocks. A VPC provides network
    isolation and routing boundaries. IAM roles and policies define which identities and services may perform actions,
    and should follow least privilege. ECR stores container images for deployment, while EC2 provides virtual machine
    compute for running workloads. These resources must be connected through network rules, instance roles, image-pull
    permissions and deployment configuration. Avoid broad wildcard permissions and public exposure by default. Choose
    network placement and access paths deliberately, and record the rationale for each security boundary.
