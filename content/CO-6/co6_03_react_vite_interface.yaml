- id: CO6-P03-C02
  code: CO6.3.2
  title: Streaming responses and chat state
  session: 33
  skilling_exp: 'CO6 practical focus: react + vite ai interface'
  btl: Create
  difficulty: Intermediate
  prereqs:
  - CO6-P03-C01
  eli5: Represent message lifecycle states and render streamed model output safely.
  key_points:
  - Explain the purpose and boundary of streaming responses and chat state.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: Streaming can make a chat interface feel responsive by displaying generated text as it arrives. The
    frontend should model request states such as idle, submitting, streaming, completed, cancelled and failed. Append
    incoming chunks safely, preserve message order and handle a stream that ends unexpectedly. Avoid rendering untrusted
    model output as raw HTML. Support cancellation where the backend permits it and prevent duplicate submissions
    while a request is active. Streaming protocols such as Server-Sent Events or fetch streams require explicit
    handling of connection closure and partial messages. The UI should communicate when an answer is incomplete
    or when a retry is underway rather than presenting a truncated response as final.
