- id: CO6-P03-C03
  code: CO6.3.3
  title: Citations, responsive design and UI component systems
  session: 33
  skilling_exp: 'CO6 practical focus: react + vite ai interface'
  btl: Create
  difficulty: Intermediate
  prereqs:
  - CO6-P03-C02
  eli5: Display source references clearly and build an accessible interface using the selected UI toolkit.
  key_points:
  - Explain the purpose and boundary of citations, responsive design and ui component systems.
  - Identify the component interfaces and trust boundaries.
  - Apply security, validation and failure handling at the appropriate layer.
  - Verify behaviour with integration tests and operational evidence.
  deep_dive: A RAG-enabled chat interface should make citations understandable and actionable. Show source labels
    or document references near the claims they support, and provide a way to inspect the retrieved material when
    permissions allow. Do not imply that a citation proves every sentence is supported. The course handout names
    Tailwind CSS with MUI or Bootstrap as styling choices; select a consistent approach rather than combining systems
    without a reason. Use semantic HTML, keyboard-accessible controls, readable contrast and responsive layouts.
    Loading, empty, error and refusal states deserve deliberate design because they are part of the user experience,
    not edge cases to hide.
