- id: CO4-P10-C03
  code: CO4.10.3
  title: Release v0.4 and operational decision record
  session: 28
  skilling_exp: 'CO4 practical focus: regression testing and ci — release v0.4'
  btl: Apply
  difficulty: Advanced
  prereqs:
  - CO4-P10-C02
  eli5: Ship a traceable prompt release with evaluation evidence, known limitations and rollback instructions.
  key_points:
  - Define the purpose and boundary of release v0.4 and operational decision record.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: Release v0.4 should identify the prompt versions, model configuration, test-set revision, evaluation
    results and security checks that were executed. The release record should explain why the chosen zero-shot or
    few-shot design was selected, how structured outputs and tools are constrained, and how judge scores were calibrated
    against human labels. Document unresolved risks, monitoring signals and rollback steps. A release is not complete
    merely because the prompt works in a local demonstration; it should be reproducible in CI and observable in
    the deployed application. Preserve prior versions so a regression can be reversed quickly.
  formulas: []
