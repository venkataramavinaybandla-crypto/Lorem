- id: CO4-P05-C03
  code: CO4.5.3
  title: Prompt registry testing and reproducibility
  session: 23
  skilling_exp: 'CO4 practical focus: prompt versioning and registry'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO4-P05-C02
  eli5: Make prompt execution reproducible by tracking templates, settings and test fixtures.
  key_points:
  - Define the purpose and boundary of prompt registry testing and reproducibility.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: A prompt result depends on more than prompt text. Model identifier, provider, decoding settings, tools,
    retrieved context and input data can all affect output. A reproducible registry records the relevant configuration
    and links it to test fixtures and evaluation results. Keep secrets outside version-controlled files and inject
    them through secure configuration. When a provider changes model behaviour, rerun the golden set and compare
    results. Exact deterministic reproduction may not always be possible for hosted models, but recording the conditions
    makes differences explainable and investigations more useful.
  formulas: []
  viz:
    type: Reproducibility record
    description: prompt hash; model ID; decoding settings; fixture; evaluation
    params:
