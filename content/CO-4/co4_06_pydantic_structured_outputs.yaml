    outcomes:
    - Expected behaviour is explicit.
    - Failure cases can be identified.
    - The design can be tested and improved.
  common_mistakes:
  - Skipping semantic checks because Pydantic accepted the object.
  - Relying on prompt wording when an application-level control is required.
