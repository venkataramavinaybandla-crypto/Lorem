- id: CO4-P06-C03
  code: CO4.6.3
  title: Retries, repair and safe fallback
  session: 24
  skilling_exp: 'CO4 practical focus: structured outputs with pydantic'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO4-P06-C02
  eli5: Handle invalid structured responses with bounded retries and predictable fallback behaviour.
  key_points:
  - Define the purpose and boundary of retries, repair and safe fallback.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: A robust structured-output pipeline distinguishes transient provider failures, malformed output and
    semantic validation failures. A retry may ask the model to correct a specific validation issue, but it should
    be bounded to avoid loops and unexpected cost. Do not expose secrets or internal stack traces in repair prompts.
    If the response remains invalid, return a safe typed error or route to human review rather than silently inventing
    defaults. Log the error category, prompt version and retry count while minimising sensitive data. Test repeated
    invalid responses and provider outages as well as normal success cases.
  formulas: []
  viz:
    type: Recovery flow
    description: validation error; bounded retry; fallback; human review
    params:
