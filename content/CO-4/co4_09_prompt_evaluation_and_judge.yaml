  - Practical
  mini_task: Create a small test example for evaluation rubrics and golden test sets, define expected behaviour,
    and record one failure mode and one safeguard.
- id: CO4-P09-C02
  code: CO4.9.2
  title: LLM-as-a-judge design and calibration
  session: 27
  skilling_exp: 'CO4 practical focus: prompt evaluation and llm-as-a-judge'
  btl: Understand
  difficulty: Advanced
  prereqs:
  - CO4-P09-C01
  eli5: Use a judge model with a clear rubric and compare its scores against human labels.
  key_points:
  - Define the purpose and boundary of llm-as-a-judge design and calibration.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: An LLM judge can help scale evaluation by scoring candidate responses against a defined rubric. The
    judge prompt should provide criteria, scoring anchors and the evidence it may use. Reduce bias by anonymising
    candidate labels, randomising response order and asking for structured scores with concise evidence. Judge outputs
    are themselves model outputs and can be inconsistent or biased toward verbosity, style or a particular answer
    position. Compare judge labels with human annotations on a shared sample, inspect disagreements and revise the
    rubric or judge prompt before using it for regression decisions.
  formulas: []
