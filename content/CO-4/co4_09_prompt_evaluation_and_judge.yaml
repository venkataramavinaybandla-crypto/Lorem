- id: CO4-P09-C03
  code: CO4.9.3
  title: Agreement, metrics and evaluation reporting
  session: 27
  skilling_exp: 'CO4 practical focus: prompt evaluation and llm-as-a-judge'
  btl: Understand
  difficulty: Advanced
  prereqs:
  - CO4-P09-C02
  eli5: Report judge-human agreement and task metrics with limitations and failure examples.
  key_points:
  - Define the purpose and boundary of agreement, metrics and evaluation reporting.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: Evaluation reports should combine quantitative metrics with qualitative inspection. Depending on the
    task, report exact match, precision/recall/F1, schema-validity rate, citation support, refusal accuracy or pairwise
    preference. For judge calibration, report an appropriate agreement measure and inspect the confusion matrix
    or disagreement categories. Include sample size and uncertainty where possible. Segment results by task type
    and input difficulty to expose regressions hidden by an average. A useful report states what changed, what improved,
    what worsened and which limitations remain; it does not reduce quality to a single opaque score.
  formulas: []
