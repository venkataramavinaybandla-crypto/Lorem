- id: CO4-P09-C01
  code: CO4.9.1
  title: Evaluation rubrics and golden test sets
  session: 27
  skilling_exp: 'CO4 practical focus: prompt evaluation and llm-as-a-judge'
  btl: Understand
  difficulty: Advanced
  prereqs:
  - CO4-P08-C03
  eli5: Define task-specific scoring criteria and maintain a stable set of representative examples.
  key_points:
  - Define the purpose and boundary of evaluation rubrics and golden test sets.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: A prompt should be evaluated against a fixed golden set that reflects real tasks, common cases, edge
    cases and known failure modes. A rubric defines observable criteria such as factual support, completeness, relevance,
    format compliance, citation quality and safe handling of unsupported requests. Specify scoring anchors so different
    reviewers interpret the scale consistently. Keep test data versioned and document its source and limitations.
    Avoid tuning repeatedly against a tiny public set that may become memorised. Include negative and adversarial
    examples where relevant, and preserve a holdout set for less biased evaluation.
  formulas: []
  viz:
    type: Evaluation design
    description: golden set; rubric; scoring anchor; holdout set
    params:
    - input
    - instruction
    - context
    - output
    - evaluation
    compute: Trace one representative example through the stages and record where validation or evaluation occurs.
    outcomes:
    - Expected behaviour is explicit.
    - Failure cases can be identified.
    - The design can be tested and improved.
  common_mistakes:
  - Changing the test set between prompt versions and calling the scores comparable.
  - Relying on prompt wording when an application-level control is required.
  - Evaluating only successful examples.
  quiz:
  - type: mcq
    question: Which statement best describes evaluation rubrics and golden test sets?
    options:
    - It applies define task-specific scoring criteria and maintain a stable set of representative examples. through
      an explicit, testable design.
    - It removes the need to evaluate model behaviour.
    - It guarantees that the model cannot make mistakes.
    - It replaces application-level validation.
    answer: 0
    explanation: The concept is useful because define task-specific scoring criteria and maintain a stable set of
      representative examples. should be specified and evaluated rather than assumed.
  - type: short_answer
    question: State one important design consideration when applying evaluation rubrics and golden test sets.
    expected_answer: Answers should identify a concrete constraint, validation step or evaluation criterion relevant
      to evaluation rubrics and golden test sets.
    explanation: A good answer connects the concept to observable application behaviour.
  - type: application
    question: You are implementing a course assistant. How would you apply evaluation rubrics and golden test sets
      to improve reliability?
    expected_answer: A strong response describes the relevant design, a failure case, a safeguard and a measurable
      test.
    explanation: Application questions assess whether the learner can transfer the concept into a practical system.
  exam_tags:
  - CO4
