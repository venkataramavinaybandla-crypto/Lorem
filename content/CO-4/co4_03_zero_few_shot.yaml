- id: CO4-P03-C03
  code: CO4.3.3
  title: Quantitative comparison of prompting strategies
  session: 21
  skilling_exp: 'CO4 practical focus: zero-shot and few-shot learning'
  btl: Understand
  difficulty: Intermediate
  prereqs:
  - CO4-P03-C02
  eli5: Compare zero-shot and few-shot designs using fixed data and explicit metrics.
  key_points:
  - Define the purpose and boundary of quantitative comparison of prompting strategies.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: A fair comparison changes one prompting factor at a time while keeping the model, decoding settings
    and evaluation set fixed. Define task-specific measures such as exact-match accuracy, macro-F1, schema validity
    or human-rated quality. Also record latency, input tokens and estimated cost because a quality gain may not
    justify the operational expense. Report sample size, scoring method and examples of failures. If results vary
    across repeated runs, include that variability rather than presenting a single lucky result. The decision should
    explain which strategy is preferred for which task conditions and when the simpler baseline remains adequate.
  formulas: []
  viz:
    type: Prompt experiment
    description: baseline; controlled variable; metric; latency; cost
    params:
    - input
    - instruction
    - context
    - output
    - evaluation
    compute: Trace one representative example through the stages and record where validation or evaluation occurs.
    outcomes:
    - Expected behaviour is explicit.
    - Failure cases can be identified.
    - The design can be tested and improved.
  common_mistakes:
  - Comparing prompt variants on different test questions or changing multiple variables at once.
  - Relying on prompt wording when an application-level control is required.
  - Evaluating only successful examples.
