- id: CO4-P02-C03
  code: CO4.2.3
  title: Context selection and prompt efficiency
  session: 20
  skilling_exp: 'CO4 practical focus: prompt structure and design'
  btl: Understand
  difficulty: Intermediate
  prereqs:
  - CO4-P02-C02
  eli5: Include relevant context while controlling noise, duplication and token use.
  key_points:
  - Define the purpose and boundary of context selection and prompt efficiency.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: Prompt context should be selected for relevance, authority, freshness and coverage. Large prompts can
    contain duplicated or contradictory facts, distract the model, increase latency and raise cost. Organise context
    with clear labels, source identifiers and boundaries. Prefer the smallest evidence set that supports the task,
    while retaining information needed to resolve ambiguity. If context is truncated, the application should detect
    or prevent silent loss of critical sections. Evaluate context changes using the same questions and compare answer
    quality, token usage and latency. Prompt efficiency is not simply minimising tokens; it is achieving the required
    quality with a defensible context budget.
  formulas: []
  viz:
    type: Context management
    description: relevance; freshness; source labels; token budget
    params:
    - input
    - instruction
    - context
    - output
    - evaluation
    compute: Trace one representative example through the stages and record where validation or evaluation occurs.
    outcomes:
    - Expected behaviour is explicit.
    - Failure cases can be identified.
    - The design can be tested and improved.
  common_mistakes:
  - Pasting every available document into the prompt without filtering.
  - Relying on prompt wording when an application-level control is required.
  - Evaluating only successful examples.
