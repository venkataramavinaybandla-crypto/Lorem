- id: CO4-P08-C03
  code: CO4.8.3
  title: System-prompt leakage and information protection
  session: 26
  skilling_exp: 'CO4 practical focus: prompt injection and information leakage'
  btl: Apply
  difficulty: Advanced
  prereqs:
  - CO4-P08-C02
  eli5: Prevent confidential instructions and data from being exposed through outputs or logs.
  key_points:
  - Define the purpose and boundary of system-prompt leakage and information protection.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: Prompt leakage occurs when protected prompt content, secrets or internal configuration is revealed.
    The strongest control is not to place credentials or unnecessary confidential data in the prompt at all. Restrict
    access to prompt assets, separate configuration secrets, redact logs and define which internal details may be
    disclosed. Test direct requests, role-play attempts, encoding tricks and indirect attacks through retrieved
    material. Also consider leakage through error messages, traces and analytics dashboards. A refusal response
    is useful, but access control, data minimisation and secure observability are the primary safeguards.
  formulas: []
  viz:
    type: Leakage surface
    description: secret minimisation; access control; redaction; audit
    params:
    - input
    - instruction
    - context
    - output
    - evaluation
    compute: Trace one representative example through the stages and record where validation or evaluation occurs.
    outcomes:
    - Expected behaviour is explicit.
    - Failure cases can be identified.
    - The design can be tested and improved.
  common_mistakes:
  - Putting API keys or passwords inside a system prompt and asking the model to hide them.
  - Relying on prompt wording when an application-level control is required.
  - Evaluating only successful examples.
