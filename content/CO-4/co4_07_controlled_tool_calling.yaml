- id: CO4-P07-C03
  code: CO4.7.3
  title: Execution boundaries and tool result handling
  session: 25
  skilling_exp: 'CO4 practical focus: safe fallbacks and controlled tool calling'
  btl: Apply
  difficulty: Intermediate
  prereqs:
  - CO4-P07-C02
  eli5: Keep tool execution in application code and handle results as untrusted data.
  key_points:
  - Define the purpose and boundary of execution boundaries and tool result handling.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: The application should decide whether a proposed call is permitted, execute it with least privilege
    and constrain its side effects. Use timeouts, rate limits, idempotency controls and audit logs for operations
    that change state. Confirm high-impact actions when required. Tool results may contain stale, malformed or adversarial
    text, so label them as returned data and do not let them override system policy. Handle timeouts and partial
    failures with clear status objects. Separate read-only tools from write operations and make the permission boundary
    visible in tests and code reviews.
  formulas: []
  viz:
    type: Execution boundary
    description: least privilege; timeout; idempotency; audit; confirmation
