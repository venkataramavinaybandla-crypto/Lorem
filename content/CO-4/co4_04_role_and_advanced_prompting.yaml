- id: CO4-P04-C01
  code: CO4.4.1
  title: Role prompting and audience adaptation
  session: 22
  skilling_exp: 'CO4 practical focus: role prompting and advanced techniques'
  btl: Understand
  difficulty: Intermediate
  prereqs:
  - CO4-P03-C03
  eli5: Use a role or perspective to clarify the task, expertise level and communication style.
  key_points:
  - Define the purpose and boundary of role prompting and audience adaptation.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: 'Role prompting describes the perspective or function the model should adopt, such as a teaching assistant,
    code reviewer or technical editor. It can help establish audience, vocabulary and priorities, but it does not
    grant real credentials or guarantee factual correctness. Define the role through observable responsibilities:
    explain assumptions, identify risks, or review code against stated criteria. Avoid relying on theatrical labels
    such as ''world expert'' as a substitute for evidence. Test whether role instructions improve consistency and
    usefulness on representative examples, and ensure they do not conflict with the task''s actual scope or safety
    requirements.'
  formulas: []
  viz:
    type: Role prompt
    description: role; audience; responsibilities; evaluation criteria
    params:
    - input
    - instruction
    - context
    - output
    - evaluation
    compute: Trace one representative example through the stages and record where validation or evaluation occurs.
    outcomes:
    - Expected behaviour is explicit.
    - Failure cases can be identified.
    - The design can be tested and improved.
  common_mistakes:
  - Assuming a role label makes the model an actual qualified professional.
  - Relying on prompt wording when an application-level control is required.
  - Evaluating only successful examples.
  quiz:
  - type: mcq
    question: Which statement best describes role prompting and audience adaptation?
    options:
    - It applies use a role or perspective to clarify the task, expertise level and communication style. through
      an explicit, testable design.
    - It removes the need to evaluate model behaviour.
    - It guarantees that the model cannot make mistakes.
    - It replaces application-level validation.
    answer: 0
    explanation: The concept is useful because use a role or perspective to clarify the task, expertise level and
      communication style. should be specified and evaluated rather than assumed.
  - type: short_answer
    question: State one important design consideration when applying role prompting and audience adaptation.
    expected_answer: Answers should identify a concrete constraint, validation step or evaluation criterion relevant
      to role prompting and audience adaptation.
    explanation: A good answer connects the concept to observable application behaviour.
  - type: application
    question: You are implementing a course assistant. How would you apply role prompting and audience adaptation
      to improve reliability?
    expected_answer: A strong response describes the relevant design, a failure case, a safeguard and a measurable
      test.
    explanation: Application questions assess whether the learner can transfer the concept into a practical system.
  exam_tags:
  - CO4
  - Prompt Engineering
  - In-Context Learning
  - Practical
  mini_task: Create a small test example for role prompting and audience adaptation, define expected behaviour,
    and record one failure mode and one safeguard.
- id: CO4-P04-C02
  code: CO4.4.2
  title: Example-guided reasoning and chain-of-thought awareness
  session: 22
  skilling_exp: 'CO4 practical focus: role prompting and advanced techniques'
  btl: Understand
  difficulty: Intermediate
  prereqs:
  - CO4-P04-C01
  eli5: Guide the response with useful intermediate outputs without demanding private reasoning traces.
  key_points:
  - Define the purpose and boundary of example-guided reasoning and chain-of-thought awareness.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: Some tasks benefit from asking the model to identify evidence, list assumptions, apply a rubric or
    show a concise calculation. These outputs make the result easier to inspect without requiring hidden internal
    reasoning. Demonstrations can show the expected level of explanation and how to handle uncertainty. Ask for
    verifiable steps, cited evidence or a short rationale appropriate to the audience. Do not treat a long reasoning
    transcript as proof of correctness; validate important claims independently. For arithmetic or code, use deterministic
    tools where appropriate and check their outputs before presenting a conclusion.
