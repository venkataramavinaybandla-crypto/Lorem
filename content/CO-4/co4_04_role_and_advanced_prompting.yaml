- id: CO4-P04-C03
  code: CO4.4.3
  title: Responsible prompt design
  session: 22
  skilling_exp: 'CO4 practical focus: role prompting and advanced techniques'
  btl: Understand
  difficulty: Intermediate
  prereqs:
  - CO4-P04-C02
  eli5: Design prompts that reduce bias, protect privacy and communicate uncertainty.
  key_points:
  - Define the purpose and boundary of responsible prompt design.
  - Identify inputs, outputs and assumptions explicitly.
  - Use application-side validation for critical requirements.
  - Evaluate behaviour with representative and edge-case examples.
  deep_dive: Responsible prompt design considers who may be affected by the output, what data is necessary, and
    how uncertainty or unsupported requests should be handled. Avoid requesting sensitive personal information unless
    it is essential and authorised. Do not encode stereotypes into roles or examples. Ask the model to distinguish
    supplied facts from assumptions and to state when evidence is insufficient. Human review may be necessary for
    consequential decisions. Test prompts across varied language, phrasing and user groups, and document known limitations.
    Responsibility is shared across prompt authors, application code, data governance and deployment processes;
    a prompt alone cannot provide complete protection.
  formulas: []
  viz:
    type: Responsible design
    description: privacy minimisation; bias testing; uncertainty; human review
    params:
    - input
    - instruction
    - context
    - output
    - evaluation
